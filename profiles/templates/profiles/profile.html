{% extends 'profiles/base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="mt-3 p-3 bg-light rounded">
    Имя пользователя: {{ username }}
</div>
<div class="mt-3 p-3 bg-light rounded">
    Страна: {{ country }}
</div>
<div class="mt-3 p-3 bg-light rounded">
    Количество оценок: {{ number_ratings }}
</div>

<div class="mt-3 p-3 bg-light rounded">
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="{{ form.country.id_for_label }}" class="form-label">Изменить страну:</label>
        {{ form.country }}
    </div>
    <button type="submit" class="btn btn-secondary mt-2">Подтвердить</button>
</form>
</div>
{% endblock %}
